<div *ngFor="let appointment of appointments">
    <mat-card class="appointment-card">
      <mat-card-header>
        <mat-card-title>Zakazani pregled</mat-card-title>
        <mat-card-subtitle>{{ appointment.status }}</mat-card-subtitle>
      </mat-card-header>
  
      <mat-card-content>
        <mat-list>
          <mat-list-item>
            <strong>Termin ID:</strong> {{ appointment.scheduledAppointmentID }}
          </mat-list-item>
          <mat-list-item>
            <strong>Datum kreiranja:</strong> {{ appointment.createdAt | date: 'short' }}
          </mat-list-item>
          <mat-list-item>
            <strong>Datum ažuriranja:</strong> {{ appointment.updatedAt | date: 'short' }}
          </mat-list-item>
          <mat-list-item>
            <strong>Grad:</strong> {{ appointment.cityName }}
          </mat-list-item>
          <mat-list-item>
            <strong>Telefon:</strong> {{ appointment.phoneNumber }}
          </mat-list-item>
        </mat-list>
      </mat-card-content>
  
      <mat-card-actions>
        <button mat-button color="primary" (click)="viewDetails(appointment)">Detalji</button>
      </mat-card-actions>
    </mat-card>
  </div>
